<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Team Website</title>
  <style>
    :root {
      --page-bg: #1b1b4d;
      --card-bg: #ffffff;
      --panel-start: #3b24b5;
      --panel-end: #1fb6e8;
      --ink: #1f2140;
      --muted: #6b7093;
      --accent: #3b3bdc;
      --pink: #e0338f;
      --border: #dfe3f0;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      background: var(--page-bg);
      color: var(--ink);
      font-family: "Segoe UI", Arial, sans-serif;
    }

    .shell {
      width: 100%;
      max-width: 1040px;
      background: var(--card-bg);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 20px 32px;
      border-bottom: 1px solid var(--border);
    }

    nav {
      display: flex;
      gap: 24px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    nav a {
      color: var(--ink);
      text-decoration: none;
    }

    nav a:hover { color: var(--accent); }

    .brand {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .content {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
    }

    .hero {
      padding: 56px 40px;
    }

    .hero h2 {
      margin: 0 0 18px;
      font-size: 30px;
      font-weight: 600;
      color: var(--accent);
    }

    .hero p {
      margin: 0 0 28px;
      max-width: 42ch;
      font-size: 15px;
      line-height: 1.6;
      color: var(--muted);
    }

    .pill {
      display: inline-block;
      padding: 11px 26px;
      border-radius: 999px;
      background: var(--pink);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-decoration: none;
    }

    .pill:hover { background: #c22a7b; }

    .login-panel {
      padding: 48px 40px;
      background: linear-gradient(150deg, var(--panel-start), var(--panel-end));
      color: #fff;
    }

    .login-panel h3 {
      margin: 0 0 4px;
      font-size: 24px;
    }

    .login-panel .hint {
      margin: 0 0 26px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.78);
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.03em;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 11px 14px;
      margin-bottom: 18px;
      font-size: 14px;
      color: #fff;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 8px;
    }

    input::placeholder { color: rgba(255, 255, 255, 0.6); }

    input:focus {
      outline: 2px solid #fff;
      outline-offset: 1px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 22px;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.85);
    }

    .remember label {
      margin: 0;
      font-weight: 400;
    }

    button {
      width: 100%;
      padding: 12px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--accent);
      background: #fff;
      border: none;
      border-radius: 999px;
      cursor: pointer;
    }

    button:hover { background: #eef0ff; }

    .status {
      min-height: 20px;
      margin: 14px 0 0;
      font-size: 13px;
      text-align: center;
      color: #ffe3f2;
    }

    footer {
      padding: 16px 32px;
      border-top: 1px solid var(--border);
      font-size: 13px;
      color: var(--muted);
    }

    @media (max-width: 820px) {
      .content { grid-template-columns: 1fr; }
      .hero { padding: 40px 28px; }
      .hero h2 { font-size: 24px; }
      .login-panel { padding: 36px 28px; }
      .topbar { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <nav>
        <a href="#home">Home</a>
        <a href="#about">About Us</a>
        <a href="#signin">Sign In</a>
      </nav>
      <span class="brand">Our Team Website</span>
    </header>

    <div class="content">
      <section class="hero" id="home">
        <h2>A Git learning playground</h2>
        <p id="about">
          We improve this site through feature branches and pull requests.
          Pick a small task, open a pull request, and let a teammate review it before merging.
        </p>
        <a class="pill" href="README.md">See More</a>
      </section>

      <section class="login-panel" id="signin">
        <h3>Sign in</h3>
        <p class="hint">Welcome back to the team.</p>

        <form id="login-form" novalidate>
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="username" placeholder="you@example.com" required>

          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Enter your password" required>

          <div class="remember">
            <input type="checkbox" id="show-password">
            <label for="show-password">Show password</label>
          </div>

          <div class="remember">
            <input type="checkbox" id="remember" name="remember">
            <label for="remember">Remember me</label>
          </div>

          <button type="submit">Sign in</button>
        </form>

        <p class="status" id="status" role="status"></p>
      </section>
    </div>

    <footer>Built by our team.</footer>
  </div>

  <script>
    document.getElementById('show-password').addEventListener('change', function () {
      document.getElementById('password').type = this.checked ? 'text' : 'password';
    });

    // Demo only: credentials are never sent or stored; real auth needs a server endpoint over HTTPS.
    document.getElementById('login-form').addEventListener('submit', function (event) {
      event.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const status = document.getElementById('status');

      if (!email || !password) {
        status.textContent = 'Please enter both email and password.';
        return;
      }

      status.textContent = 'Signed in as ' + email + ' (demo only).';
      this.reset();
    });
  </script>
</body>
</html>
